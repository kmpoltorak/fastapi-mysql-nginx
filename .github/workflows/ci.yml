name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: pip install -r app/requirements.txt flake8 pytest httpx
    - name: Lint with flake8
      run: flake8 app
    - name: Test
      working-directory: app
      run: python -m pytest -q
