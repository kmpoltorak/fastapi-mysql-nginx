services:
  db:
    image: mysql:8.3
    restart: always
    volumes:
      - simpledb:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-TestDb890}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: app
    restart: always
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-db}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-TestDb890}
      TZ: ${TZ:-Europe/Warsaw}
      API_KEY: ${API_KEY:-test}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  proxy:
    build:
      context: nginx
    restart: always
    ports:
      - 80:80
    depends_on:
      app:
        condition: service_healthy

volumes:
  simpledb:
