services:
  db:
    image: mysql:8.4
    restart: always
    command: --partial-revokes=ON
    volumes:
      - simpledb:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in .env}
    healthcheck:
      # TCP, not socket: the temporary server used during init has networking disabled
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: app
    restart: always
    environment:
      MYSQL_HOST: db
      DB_PASSWORD: ${DB_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      API_CLIENT_ID: ${API_CLIENT_ID:-app}
      API_CLIENT_SECRET: ${API_CLIENT_SECRET:?set API_CLIENT_SECRET in .env}
      TZ: ${TZ:-Europe/Warsaw}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  proxy:
    build:
      context: nginx
    restart: always
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/certs:/etc/nginx/certs
    depends_on:
      app:
        condition: service_healthy

volumes:
  simpledb:
